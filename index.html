<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Angel's Love Puzzle 💗</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(160deg,#ffddea,#fff5fa 50%,#dff7e7);color:#6c3650;touch-action:manipulation}
#app{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:16px 12px}
.top{width:min(560px,96vw);display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{background:#ffffffd9;border:2px solid #fff;border-radius:999px;padding:9px 13px;font-weight:900;box-shadow:0 5px 18px #7c466322}
h1{margin:16px 0 3px;text-align:center;font-size:29px}
.sub{text-align:center;margin:0 0 12px;font-weight:650;opacity:.8}
#board{width:min(440px,94vw);display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:8px}
.card{aspect-ratio:1;border:0;border-radius:18px;background:transparent;perspective:700px;padding:0;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .42s;transform-style:preserve-3d}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;box-shadow:0 7px 17px #6b345021;border:2px solid #fff;font-size:30px}
.back{background:linear-gradient(135deg,#ff75aa,#ff9fc5);color:#fff;font-size:27px}
.front{background:#fff8fc;transform:rotateY(180deg)}
.card.matched .front{background:#e8ffe9;box-shadow:0 0 0 3px #91d89b,0 8px 20px #6b345020}
#message{margin-top:13px;background:#ffffffc9;padding:9px 16px;border-radius:15px;font-weight:800;text-align:center;min-height:20px}
#new{margin-top:13px;border:0;border-radius:999px;background:#ff6da7;color:white;padding:11px 20px;font-weight:900;font-size:15px;cursor:pointer}
#modal{display:none;position:fixed;inset:0;z-index:5;background:#63374d55;backdrop-filter:blur(5px);place-items:center;padding:20px}
.box{width:min(420px,94vw);background:#fff9fc;border:3px solid white;border-radius:30px;padding:28px 22px;text-align:center;box-shadow:0 25px 70px #48223855}
.box h2{font-size:31px;margin:0 0 8px}
.box p{line-height:1.6}
.box button{border:0;background:#ff6aa5;color:white;padding:13px 25px;border-radius:999px;font-weight:900;font-size:16px}
.pop{position:fixed;pointer-events:none;font-size:28px;animation:pop .8s forwards}
@keyframes pop{0%{opacity:1;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-80px) scale(1.3)}}
</style>
</head>
<body>
<div id="app">
 <div class="top">
  <div class="pill">💗 Pairs: <span id="pairs">0</span>/8</div>
  <div class="pill">⭐ Moves: <span id="moves">0</span></div>
 </div>
 <h1>Angel's Love Puzzle 🧩</h1>
 <p class="sub">Find all the matching pairs! 💕</p>
 <div id="board"></div>
 <div id="message">Tap a card to begin! 🌸</div>
 <button id="new">🔄 New Puzzle</button>
</div>

<div id="modal">
 <div class="box">
  <h2>YOU DID IT! 🥹💗</h2>
  <p id="result"></p>
  <button id="play">Play Again 🌷</button>
 </div>
</div>

<script>
const emojis=["🌷","🦋","🍓","🌈","🐻","🌙","🍰","💖"];
let cards=[],first=null,second=null,locked=false,moves=0,matched=0;

const board=document.getElementById("board");
const pairs=document.getElementById("pairs");
const movesEl=document.getElementById("moves");
const message=document.getElementById("message");
const modal=document.getElementById("modal");

function shuffle(a){
 for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
function pop(x,y,symbol="💗"){
 const p=document.createElement("div");p.className="pop";p.textContent=symbol;
 p.style.left=x+"px";p.style.top=y+"px";document.body.appendChild(p);
 setTimeout(()=>p.remove(),800);
}
function build(){
 board.innerHTML="";first=second=null;locked=false;moves=0;matched=0;
 pairs.textContent="0";movesEl.textContent="0";message.textContent="Find the matching hearts... 🌸";
 cards=shuffle([...emojis,...emojis]);
 cards.forEach((emoji,i)=>{
  const b=document.createElement("button");b.className="card";b.dataset.emoji=emoji;
  b.innerHTML=`<div class="inner"><div class="face back">💗</div><div class="face front">${emoji}</div></div>`;
  b.addEventListener("click",()=>flip(b));
  board.appendChild(b);
 });
}
function flip(card){
 if(locked||card===first||card.classList.contains("matched"))return;
 card.classList.add("flipped");
 if(!first){first=card;message.textContent="Now find its twin! 👀💗";return}
 second=card;locked=true;moves++;movesEl.textContent=moves;
 if(first.dataset.emoji===second.dataset.emoji){
   setTimeout(()=>{
    first.classList.add("matched");second.classList.add("matched");
    matched++;pairs.textContent=matched;
    const r1=first.getBoundingClientRect();pop(r1.left+r1.width/2,r1.top,"💗");
    message.textContent=matched===8?"Every pair found! 🥹":"Perfect match! ✨";
    first=second=null;locked=false;
    if(matched===8)setTimeout(win,500);
   },350);
 }else{
   message.textContent="Not quite... try again! 🥰";
   setTimeout(()=>{
    first.classList.remove("flipped");second.classList.remove("flipped");
    first=second=null;locked=false;
   },750);
 }
}
function win(){
 document.getElementById("result").innerHTML=
 `Angel matched all <b>8 pairs</b> in <b>${moves} moves</b>! 🌸<br><br>
 You found all the little pieces of this love puzzle... but there is one thing that can never be hidden:<br><br>
 <b>“No puzzle is complete without my Angel in it. 💗🥹”</b>`;
 modal.style.display="grid";
}
document.getElementById("new").onclick=build;
document.getElementById("play").onclick=()=>{modal.style.display="none";build()};
build();
</script>
</body>
</html>
